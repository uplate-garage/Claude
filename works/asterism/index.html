<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asterism</title>
<meta name="description" content="One shared sky; your figures. Draw lines between stars, name what you see, and your browser keeps your sky.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ffc873'/%3E%3Ccircle cx='16' cy='16' r='11' fill='%23ffc873' opacity='0.25'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&family=Spline+Sans+Mono:wght@300..500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --night: #0a121d;
    --loam: #111d2b;
    --loam-edge: #1c2c3e;
    --moth: #e9e4d6;
    --mist: #8ca0af;
    --mist-dim: #7a8e9d;
    --ember: #ffc873;
    --display: "Fraunces", "Iowan Old Style", Georgia, serif;
    --reading: "Newsreader", "Charter", Georgia, serif;
    --ledger: "Spline Sans Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html { scrollbar-gutter: stable; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    background: var(--night);
    color: var(--moth);
    font-family: var(--reading);
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: clamp(26px, 5vh, 56px) clamp(16px, 4vw, 40px) 64px;
  }

  header h1 {
    margin: 0;
    font-family: var(--display);
    font-style: italic;
    font-weight: 340;
    font-size: clamp(30px, 4.8vw, 46px);
    line-height: 1.08;
  }

  header .plate-line {
    margin: 10px 0 0;
    font-family: var(--ledger);
    font-weight: 320;
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--mist-dim);
  }

  header .plate-line a {
    color: var(--mist);
    text-decoration: underline;
    text-decoration-color: var(--mist-dim);
    text-underline-offset: 3px;
  }

  header .plate-line a:hover, header .plate-line a:focus-visible { color: var(--ember); }

  /* ---------- sky ---------- */

  .sky-frame {
    position: relative;
    margin-top: clamp(20px, 4vh, 36px);
    border: 1px solid var(--loam-edge);
    border-radius: 6px;
    overflow: hidden;
    background: #070d16;
  }

  .sky-frame canvas {
    display: block;
    width: 100%;
    height: auto;
    cursor: crosshair;
    touch-action: manipulation;
  }

  .sky-frame canvas:focus-visible { outline: 1px solid var(--ember); outline-offset: -3px; }

  /* naming form, floats over the sky's foot */
  #nameForm {
    position: absolute;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    background: rgba(17, 29, 43, 0.94);
    border: 1px solid var(--loam-edge);
    border-radius: 10px;
    max-width: calc(100% - 28px);
  }

  #nameForm[hidden] { display: none; }

  #nameInput {
    font-family: var(--display);
    font-style: italic;
    font-size: 15px;
    color: var(--moth);
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--mist-dim);
    padding: 4px 2px;
    min-width: 0;
    width: 200px;
  }

  #nameInput:focus-visible { outline: none; border-bottom-color: var(--ember); }

  #nameForm button {
    font-family: var(--ledger);
    font-weight: 400;
    font-size: 11.5px;
    letter-spacing: 0.1em;
    color: var(--ember);
    background: transparent;
    border: 1px solid rgba(255, 200, 115, 0.45);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
  }

  #nameForm button:hover, #nameForm button:focus-visible { border-color: var(--ember); background: rgba(255,200,115,0.08); }
  #nameForm button:focus-visible { outline: 1px solid var(--ember); outline-offset: 2px; }

  /* ---------- bench (controls under the sky) ---------- */

  .bench {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 10px;
    margin-top: 12px;
  }

  .bench button {
    font-family: var(--ledger);
    font-weight: 380;
    font-size: 11.5px;
    letter-spacing: 0.1em;
    color: var(--mist);
    background: transparent;
    border: 1px solid var(--loam-edge);
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
  }

  .bench button:hover { color: var(--moth); border-color: var(--mist-dim); }
  .bench button:focus-visible { outline: 1px solid var(--ember); outline-offset: 2px; }
  .bench button[disabled] { opacity: 0.4; cursor: default; }

  .bench .hint {
    margin-left: auto;
    font-family: var(--ledger);
    font-weight: 320;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--mist-dim);
  }

  /* ---------- your sky (saved list) ---------- */

  #mySky {
    margin-top: 16px;
    border: 1px solid var(--loam-edge);
    border-radius: 10px;
    padding: 12px 16px;
  }

  #mySky[hidden] { display: none; }

  #mySky h2 {
    margin: 0 0 8px;
    font-family: var(--ledger);
    font-weight: 380;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--mist-dim);
  }

  #mySky ul { margin: 0; padding: 0; list-style: none; }

  #mySky li {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 6px 0;
    border-top: 1px dotted rgba(122, 142, 157, 0.3);
    font-size: 15px;
  }

  #mySky li:first-child { border-top: 0; }

  #mySky .aname { font-family: var(--display); font-style: italic; }
  #mySky .meta {
    font-family: var(--ledger);
    font-weight: 320;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--mist-dim);
    margin-left: auto;
    white-space: nowrap;
  }

  #mySky .unmake {
    font-family: var(--ledger);
    font-size: 14px;
    color: var(--mist-dim);
    background: transparent;
    border: 0;
    cursor: pointer;
    padding: 2px 6px;
  }

  #mySky .unmake:hover, #mySky .unmake:focus-visible { color: var(--ember); }
  #mySky .unmake:focus-visible { outline: 1px solid var(--ember); outline-offset: 1px; }

  #mySky .empty { color: var(--mist-dim); font-style: italic; border-top: 0; }

  /* ---------- about ---------- */

  .about {
    margin-top: clamp(36px, 7vh, 56px);
    border-top: 1px solid var(--loam-edge);
    padding-top: 18px;
  }

  .about h2 {
    margin: 0 0 12px;
    font-family: var(--ledger);
    font-weight: 380;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--mist-dim);
  }

  .about p {
    margin: 0 0 10px;
    font-weight: 350;
    font-size: 15px;
    line-height: 1.65;
    max-width: 62ch;
    color: var(--mist);
  }

  .about p strong { font-weight: 500; color: var(--moth); }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Asterism</h1>
    <p class="plate-line">one shared sky · the figures are yours · part of <a href="../../index.html">glim</a></p>
  </header>

  <div class="sky-frame">
    <canvas id="sky" tabindex="0" role="application"
      aria-label="A star field you can draw on. Click stars to link them into a figure, or use arrow keys to move between stars, Enter to link, F to finish and name your figure, U to undo, Escape to abandon."
      aria-describedby="skyStatus"></canvas>
    <form id="nameForm" hidden>
      <label class="sr-only" for="nameInput">Name your figure</label>
      <input id="nameInput" maxlength="40" placeholder="name what you see" autocomplete="off">
      <button type="submit">SET IN THE SKY</button>
    </form>
  </div>

  <div class="bench">
    <button id="finishBtn" disabled>finish figure</button>
    <button id="undoBtn" disabled>undo</button>
    <button id="cancelBtn" disabled>abandon</button>
    <button id="mySkyBtn" aria-expanded="false">your sky · 0</button>
    <span class="hint">click star to star · a figure needs at least two</span>
  </div>

  <div id="mySky" hidden>
    <h2>Your sky</h2>
    <ul id="mySkyList"></ul>
  </div>

  <p class="sr-only" role="status" id="skyStatus"></p>

  <section class="about">
    <h2>About the figures</h2>
    <div id="aboutBody">
      <p>Loading the sky's history…</p>
    </div>
  </section>
</div>

<script>
'use strict';

/* ================= the shared sky =================
   Seeded so every visitor sees the same stars. Seed 88, for the number of
   official constellations the sky is allowed to have. */

const SEED = 88;
const STAR_COUNT = 200;

function rand(seed) {
  let s = seed >>> 0;
  return function () {
    s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

const STARS = (() => {
  const r = rand(SEED);
  const out = [];
  for (let i = 0; i < STAR_COUNT; i++) {
    const mag = r();
    out.push({
      fx: 0.03 + r() * 0.94,
      fy: 0.05 + r() * 0.9,
      m: mag,                       // 0 faint .. 1 bright
      tw: 0.3 + r() * 1.2,
      ph: r() * Math.PI * 2,
    });
  }
  // a handful of proper beacons
  for (let i = 0; i < 12; i++) out[Math.floor(r() * out.length)].m = 0.85 + r() * 0.15;
  return out;
})();

/* the milky way: a diagonal band with dark lanes in it */
const BAND = (() => {
  const r = rand(SEED * 7 + 1);
  const patches = [];
  for (let i = 0; i < 4; i++) {
    patches.push({ t: 0.15 + r() * 0.7, off: (r() - 0.5) * 0.05, rad: 0.05 + r() * 0.05, deep: i === 0 ? 0.9 : 0.5 + r() * 0.3 });
  }
  return { x0: 0.08, y0: 0.95, x1: 0.98, y1: 0.05, patches };
})();

/* ================= state ================= */

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
const canvas = document.getElementById('sky');
const ctx = canvas ? canvas.getContext('2d') : null;

let W = 0, H = 0;
function sizeSky() {
  if (!ctx) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth || canvas.parentElement.clientWidth;
  H = Math.round(W * 0.62);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', sizeSky);

const state = {
  figures: [],        // saved: {name, stars: [idx], at}
  chain: [],          // stars of the figure being drawn
  hover: -1,          // star index under the pointer
  reticle: -1,        // keyboard stepper star
  naming: false,
};

function loadSky() {
  try {
    const raw = localStorage.getItem('asterism-sky-v1');
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed)) {
      state.figures = parsed.filter(f => f && typeof f.name === 'string' &&
        Array.isArray(f.stars) && f.stars.length >= 2 &&
        f.stars.every(i => Number.isInteger(i) && i >= 0 && i < STARS.length))
        .map(f => ({ name: String(f.name).slice(0, 40), stars: f.stars, at: Number(f.at) || 0 }));
    }
  } catch (e) { /* a sky can start empty */ }
}

function saveSky() {
  try { localStorage.setItem('asterism-sky-v1', JSON.stringify(state.figures)); } catch (e) { /* fine */ }
}

/* ================= elements ================= */

const statusEl = document.getElementById('skyStatus');
const finishBtn = document.getElementById('finishBtn');
const undoBtn = document.getElementById('undoBtn');
const cancelBtn = document.getElementById('cancelBtn');
const mySkyBtn = document.getElementById('mySkyBtn');
const mySky = document.getElementById('mySky');
const mySkyList = document.getElementById('mySkyList');
const nameForm = document.getElementById('nameForm');
const nameInput = document.getElementById('nameInput');

function announce(t) { statusEl.textContent = t; }

function refreshBench() {
  const drawing = state.chain.length > 0;
  finishBtn.disabled = state.chain.length < 2;
  undoBtn.disabled = !drawing;
  cancelBtn.disabled = !drawing;
  mySkyBtn.textContent = 'your sky · ' + state.figures.length;
}

/* ================= geometry ================= */

function starXY(i) {
  const s = STARS[i];
  return [s.fx * W, s.fy * H];
}

function nearestStar(px, py, maxDist) {
  let best = -1, bd = maxDist * maxDist;
  for (let i = 0; i < STARS.length; i++) {
    const [x, y] = starXY(i);
    const d = (x - px) * (x - px) + (y - py) * (y - py);
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}

function nearestInDirection(from, dx, dy) {
  const [fx, fy] = starXY(from);
  let best = -1, bestScore = Infinity;
  for (let i = 0; i < STARS.length; i++) {
    if (i === from) continue;
    const [x, y] = starXY(i);
    const vx = x - fx, vy = y - fy;
    const along = vx * dx + vy * dy;
    if (along <= 0) continue;
    const perp = Math.abs(vx * dy - vy * dx);
    const score = along + perp * 2.2;
    if (score < bestScore) { bestScore = score; best = i; }
  }
  return best;
}

function centroid(starIdxs) {
  let cx = 0, cy = 0;
  for (const i of starIdxs) { const [x, y] = starXY(i); cx += x; cy += y; }
  return [cx / starIdxs.length, cy / starIdxs.length];
}

/* ================= figure lifecycle ================= */

function selectStar(i) {
  if (state.naming || i < 0) return;
  const last = state.chain[state.chain.length - 1];
  if (i === last && state.chain.length >= 2) { beginNaming(); return; }
  if (i === last) return;
  state.chain.push(i);
  announce(state.chain.length === 1
    ? 'First star chosen. Link more, then finish.'
    : state.chain.length + ' stars in your figure.');
  refreshBench();
}

function undoStar() {
  if (state.naming) return;
  state.chain.pop();
  announce(state.chain.length ? state.chain.length + ' stars in your figure.' : 'Figure abandoned.');
  refreshBench();
}

function cancelFigure() {
  state.chain = [];
  state.naming = false;
  nameForm.hidden = true;
  announce('Figure abandoned.');
  refreshBench();
}

function beginNaming() {
  if (state.chain.length < 2) return;
  state.naming = true;
  nameForm.hidden = false;
  nameInput.value = '';
  nameInput.focus();
  announce('Name your figure of ' + state.chain.length + ' stars.');
}

nameForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const name = nameInput.value.trim().slice(0, 40);
  if (!name) { nameInput.focus(); return; }
  state.figures.push({ name, stars: [...state.chain], at: Date.now() });
  saveSky();
  state.chain = [];
  state.naming = false;
  nameForm.hidden = true;
  renderMySky();
  refreshBench();
  announce('"' + name + '" set in the sky.');
  canvas.focus();
});

finishBtn.addEventListener('click', beginNaming);
undoBtn.addEventListener('click', undoStar);
cancelBtn.addEventListener('click', cancelFigure);

mySkyBtn.addEventListener('click', () => {
  const open = mySky.hidden;
  mySky.hidden = !open;
  mySkyBtn.setAttribute('aria-expanded', String(open));
});

function renderMySky() {
  mySkyList.textContent = '';
  if (!state.figures.length) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = 'nothing drawn yet — the sky is patient';
    mySkyList.appendChild(li);
    return;
  }
  state.figures.forEach((f, idx) => {
    const li = document.createElement('li');
    const name = document.createElement('span');
    name.className = 'aname';
    name.textContent = f.name;
    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = f.stars.length + ' stars';
    const del = document.createElement('button');
    del.className = 'unmake';
    del.textContent = '×';
    del.setAttribute('aria-label', 'unmake ' + f.name);
    del.addEventListener('click', () => {
      state.figures.splice(idx, 1);
      saveSky();
      renderMySky();
      refreshBench();
      announce('"' + f.name + '" unmade. The stars keep shining.');
    });
    li.append(name, meta, del);
    mySkyList.appendChild(li);
  });
}

/* ================= input ================= */

canvas.addEventListener('pointermove', (e) => {
  const rect = canvas.getBoundingClientRect();
  state.hover = nearestStar(e.clientX - rect.left, e.clientY - rect.top, 16);
});

canvas.addEventListener('pointerleave', () => { state.hover = -1; });

canvas.addEventListener('click', (e) => {
  if (state.naming) return;
  const rect = canvas.getBoundingClientRect();
  const i = nearestStar(e.clientX - rect.left, e.clientY - rect.top, 18);
  if (i >= 0) { state.reticle = i; selectStar(i); }
});

canvas.addEventListener('keydown', (e) => {
  if (state.naming) return;
  const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (dirs[e.key]) {
    e.preventDefault();
    if (state.reticle < 0) {
      // begin at the brightest star
      let bi = 0; for (let i = 1; i < STARS.length; i++) if (STARS[i].m > STARS[bi].m) bi = i;
      state.reticle = bi;
    } else {
      const n = nearestInDirection(state.reticle, dirs[e.key][0], dirs[e.key][1]);
      if (n >= 0) state.reticle = n;
    }
    announce('Star ' + (state.reticle + 1) + ' of ' + STARS.length + '.');
    return;
  }
  if (e.key === 'Enter') { e.preventDefault(); if (state.reticle >= 0) selectStar(state.reticle); }
  if (e.key === 'f' || e.key === 'F') { e.preventDefault(); beginNaming(); }
  if (e.key === 'u' || e.key === 'U' || e.key === 'Backspace') { e.preventDefault(); undoStar(); }
  if (e.key === 'Escape') { e.preventDefault(); cancelFigure(); }
});

nameInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { e.preventDefault(); cancelFigure(); canvas.focus(); }
});

/* ================= drawing ================= */

let last = performance.now(), clock = 0;

function drawBand() {
  const { x0, y0, x1, y1, patches } = BAND;
  const ax = x0 * W, ay = y0 * H, bx = x1 * W, by = y1 * H;
  const dx = bx - ax, dy = by - ay;
  const len = Math.hypot(dx, dy);
  const nx = -dy / len, ny = dx / len;
  // soft band strips
  ctx.save();
  for (let i = -2; i <= 2; i++) {
    const off = i * 14;
    const g = ctx.createLinearGradient(ax + nx * off, ay + ny * off, ax + nx * (off + 26), ay + ny * (off + 26));
    g.addColorStop(0, 'rgba(233,228,214,0.045)');
    g.addColorStop(1, 'rgba(233,228,214,0)');
    ctx.strokeStyle = 'rgba(233,228,214,' + (0.028 - Math.abs(i) * 0.005).toFixed(3) + ')';
    ctx.lineWidth = 30 - Math.abs(i) * 4;
    ctx.beginPath();
    ctx.moveTo(ax + nx * off, ay + ny * off);
    ctx.lineTo(bx + nx * off, by + ny * off);
    ctx.stroke();
  }
  // the dark lanes: figures made of absence
  for (const p of patches) {
    const px = ax + dx * p.t + nx * p.off * H;
    const py = ay + dy * p.t + ny * p.off * H;
    const rad = p.rad * H * 1.6;
    const g = ctx.createRadialGradient(px, py, 0, px, py, rad);
    g.addColorStop(0, 'rgba(7,13,22,' + (0.85 * p.deep).toFixed(2) + ')');
    g.addColorStop(1, 'rgba(7,13,22,0)');
    ctx.fillStyle = g;
    ctx.fillRect(px - rad, py - rad, rad * 2, rad * 2);
  }
  ctx.restore();
}

function frame(nowMs) {
  const dt = Math.min((nowMs - last) / 1000, 0.1);
  last = nowMs;
  clock += dt;
  const still = reduceMotion.matches;

  ctx.fillStyle = '#070d16';
  ctx.fillRect(0, 0, W, H);

  drawBand();

  // stars
  for (let i = 0; i < STARS.length; i++) {
    const s = STARS[i];
    const [x, y] = starXY(i);
    const tw = still ? 1 : 0.78 + 0.22 * Math.sin(clock * s.tw + s.ph);
    const inChain = state.chain.includes(i);
    const r = 0.5 + s.m * 1.5 + (inChain ? 0.7 : 0);
    ctx.globalAlpha = (0.25 + s.m * 0.7) * tw;
    ctx.fillStyle = inChain ? '#ffc873' : '#dfe5e9';
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // saved figures
  ctx.save();
  ctx.strokeStyle = 'rgba(255,200,115,0.32)';
  ctx.lineWidth = 1;
  const fontReady = 'fonts' in document ? document.fonts.check('12px Fraunces') : false;
  ctx.font = 'italic 12.5px ' + (fontReady ? 'Fraunces, Georgia, serif' : 'Georgia, serif');
  for (const f of state.figures) {
    ctx.beginPath();
    f.stars.forEach((si, k) => {
      const [x, y] = starXY(si);
      k === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
    const [cx, cy] = centroid(f.stars);
    ctx.fillStyle = 'rgba(140,160,175,0.75)';
    ctx.fillText(f.name, cx + 8, cy - 6);
  }
  ctx.restore();

  // figure in progress
  if (state.chain.length) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,200,115,0.7)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    state.chain.forEach((si, k) => {
      const [x, y] = starXY(si);
      k === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.restore();
  }

  // hover halo
  if (state.hover >= 0) {
    const [x, y] = starXY(state.hover);
    ctx.strokeStyle = 'rgba(255,200,115,0.6)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(x, y, 7, 0, Math.PI * 2);
    ctx.stroke();
  }

  // keyboard reticle
  if (state.reticle >= 0 && document.activeElement === canvas) {
    const [x, y] = starXY(state.reticle);
    ctx.strokeStyle = 'rgba(233,228,214,0.8)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.arc(x, y, 10, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  requestAnimationFrame(frame);
}

/* ================= boot ================= */

loadSky();
renderMySky();
refreshBench();
if (ctx) {
  sizeSky();
  requestAnimationFrame(frame);
}
</script>
