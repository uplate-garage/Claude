<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Field Guide to Small Lights</title>
<meta name="description" content="Nine real luminous phenomena of the night and one honest mystery — sea sparkle to red sprites to the will-o'-the-wisp — each with a true entry and its own living plate.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ffc873'/%3E%3Ccircle cx='16' cy='16' r='11' fill='%23ffc873' opacity='0.25'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&family=Spline+Sans+Mono:wght@300..500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --night: #0a121d;
    --loam: #111d2b;
    --loam-edge: #1c2c3e;
    --moth: #e9e4d6;
    --mist: #8ca0af;
    --mist-dim: #7a8e9d;
    --ember: #ffc873;
    --display: "Fraunces", "Iowan Old Style", Georgia, serif;
    --reading: "Newsreader", "Charter", Georgia, serif;
    --ledger: "Spline Sans Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html { scrollbar-gutter: stable; }

  nav.index { min-width: 0; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    background: var(--night);
    color: var(--moth);
    font-family: var(--reading);
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1060px;
    margin: 0 auto;
    padding: clamp(28px, 6vh, 64px) clamp(18px, 4vw, 40px) 60px;
  }

  header h1 {
    margin: 0;
    font-family: var(--display);
    font-style: italic;
    font-weight: 340;
    font-size: clamp(28px, 4.6vw, 44px);
    line-height: 1.1;
    text-wrap: balance;
  }

  header .plate-line {
    margin: 10px 0 0;
    font-family: var(--ledger);
    font-weight: 320;
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--mist-dim);
  }

  header .plate-line a { color: var(--mist); text-decoration: underline; text-decoration-color: var(--mist-dim); text-underline-offset: 3px; }
  header .plate-line a:hover, header .plate-line a:focus-visible { color: var(--ember); }

  .book {
    display: grid;
    grid-template-columns: 208px 1fr;
    gap: clamp(20px, 3.5vw, 44px);
    margin-top: clamp(28px, 5vh, 52px);
    align-items: start;
  }

  /* ---------- index rail ---------- */

  nav.index h2 {
    margin: 0 0 10px;
    font-family: var(--ledger);
    font-weight: 380;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--mist-dim);
  }

  nav.index ol {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  nav.index button {
    display: flex;
    align-items: baseline;
    gap: 10px;
    width: 100%;
    padding: 7px 8px 7px 6px;
    border: 0;
    border-left: 2px solid transparent;
    background: transparent;
    color: var(--mist);
    font-family: var(--reading);
    font-weight: 350;
    font-size: 15px;
    text-align: left;
    cursor: pointer;
  }

  nav.index button .num {
    font-family: var(--ledger);
    font-weight: 320;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    color: var(--mist-dim);
    min-width: 26px;
  }

  nav.index button:hover { color: var(--moth); }
  nav.index button:focus-visible { outline: 1px solid var(--ember); outline-offset: 2px; }

  nav.index button[aria-current="true"] {
    color: var(--moth);
    border-left-color: var(--accent, var(--ember));
  }

  nav.index button[aria-current="true"] .num { color: var(--accent, var(--ember)); }

  /* ---------- plate ---------- */

  .plate { min-width: 0; }

  .frame {
    position: relative;
    border: 1px solid var(--loam-edge);
    border-radius: 6px;
    overflow: hidden;
    background: #070d16;
  }

  .frame canvas {
    display: block;
    width: 100%;
    height: auto;
  }

  .frame .plate-no {
    position: absolute;
    top: 10px;
    right: 12px;
    font-family: var(--ledger);
    font-weight: 320;
    font-size: 10.5px;
    letter-spacing: 0.18em;
    color: rgba(140, 160, 175, 0.85);
    pointer-events: none;
  }

  article.entry { margin-top: 22px; }

  .entry .head {
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
  }

  .entry h3 {
    margin: 0;
    font-family: var(--display);
    font-style: italic;
    font-weight: 380;
    font-size: clamp(24px, 3.4vw, 32px);
    line-height: 1.15;
  }

  .entry .latin {
    font-family: var(--reading);
    font-style: italic;
    font-weight: 350;
    font-size: 15px;
    color: var(--mist);
  }

  .entry .kind {
    font-family: var(--ledger);
    font-weight: 380;
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent, var(--ember));
    border: 1px solid var(--accent, var(--ember));
    border: 1px solid color-mix(in srgb, var(--accent, var(--ember)) 45%, transparent);
    border-radius: 999px;
    padding: 4px 10px;
    white-space: nowrap;
  }

  .entry .desc {
    margin: 14px 0 0;
    font-weight: 350;
    font-size: 17.5px;
    line-height: 1.65;
    max-width: 62ch;
  }

  .entry .where {
    margin: 14px 0 0;
    font-family: var(--ledger);
    font-weight: 320;
    font-size: 12px;
    letter-spacing: 0.06em;
    line-height: 1.8;
    color: var(--mist);
    max-width: 70ch;
  }

  .entry .where .k { color: var(--mist-dim); letter-spacing: 0.14em; }

  /* ---------- pager ---------- */

  .pager {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 26px;
  }

  .pager button {
    font-family: var(--ledger);
    font-weight: 400;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--mist);
    background: transparent;
    border: 1px solid var(--loam-edge);
    border-radius: 999px;
    padding: 9px 18px;
    cursor: pointer;
  }

  .pager button:hover { color: var(--moth); border-color: var(--mist-dim); }
  .pager button:focus-visible { outline: 1px solid var(--ember); outline-offset: 2px; }

  .pager .count {
    font-family: var(--ledger);
    font-weight: 320;
    font-size: 11.5px;
    letter-spacing: 0.12em;
    color: var(--mist-dim);
    font-variant-numeric: tabular-nums;
  }

  .keys {
    margin-left: auto;
    font-family: var(--ledger);
    font-weight: 320;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    color: var(--mist-dim);
  }

  /* ---------- narrow ---------- */

  @media (max-width: 760px) {
    .book { grid-template-columns: 1fr; }

    nav.index ol {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding: 4px 4px 6px;
      margin: 0 -4px;
    }

    nav.index button {
      border-left: 0;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      width: auto;
      font-size: 14px;
      padding: 6px 10px;
    }

    nav.index button[aria-current="true"] { border-bottom-color: var(--accent, var(--ember)); }
    .keys { display: none; }
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>A Field Guide to Small Lights</h1>
    <p class="plate-line">nine true lights of the night, and one contested · plates drawn live, in each light's own color · part of <a href="../../index.html">glim</a></p>
  </header>

  <div class="book">
    <nav class="index" aria-label="Plates">
      <h2>Plates</h2>
      <ol id="indexList"></ol>
    </nav>

    <section class="plate" aria-live="off">
      <div class="frame">
        <canvas id="vignette" role="img"></canvas>
        <span class="plate-no" id="plateNo"></span>
      </div>
      <article class="entry" id="entry">
        <div class="head">
          <h3 id="entryTitle"></h3>
          <span class="latin" id="entryLatin"></span>
          <span class="kind" id="entryKind"></span>
        </div>
        <p class="desc" id="entryDesc"></p>
        <p class="where" id="entryWhere"></p>
      </article>
      <div class="pager">
        <button id="prevBtn">← previous</button>
        <button id="nextBtn">next →</button>
        <span class="count" id="countLine"></span>
        <span class="keys">← and → turn the plates</span>
      </div>
      <p class="sr-only" role="status" id="plateStatus"></p>
    </section>
  </div>
</div>

<script>
'use strict';

/* ============ entries (text filled from the expedition) ============ */

const ENTRIES = [
  {
    key: 'sea-sparkle', title: 'Sea sparkle', latin: 'Noctiluca scintillans',
    kind: 'living light', color: '#45d0ff',
    description: `A single cell nearly the size of a pinhead, Noctiluca scintillans is a balloon of a dinoflagellate that answers touch with light. Shear from a breaking wave fires an electrical pulse across its inner vacuole membrane; protons flood tiny organelles called scintillons, souring them until luciferase wakes and burns luciferin blue. Stimulus to flash takes about twenty milliseconds, and each flash lasts a tenth of a second. Crowded by the billion, they trace every wave crest, every footprint, every oar stroke.`,
    where: `Find a calm bay on a moonless night where the water looked faintly pink or rusty by day, then drag a hand or a paddle through the shallows and watch the wake ignite.`,
    scene: `A dark bay; a wave edge sweeps shoreward and ignites as blue sparks that vanish in a blink.`,
  },
  {
    key: 'foxfire', title: 'Foxfire', latin: 'Armillaria mellea',
    kind: 'living light', color: '#6df27f',
    description: `Rotting oak and beech sometimes light themselves from inside: mycelium of honey fungus (Armillaria) laces the dead wood, and an enzyme there oxidizes a luciferin, releasing cold green light near 525 nanometers. It burns day and night while the wood stays damp, usually too faint for any but dark-adapted eyes. Aristotle recorded it; miners watched pit props shine; in 1775 Bushnell's one-man submarine Turtle carried foxfire to light its compass, since a candle would have eaten the operator's air.`,
    where: `Peel loose bark from a wet, well-rotted hardwood log on a dark summer night in old forest, then give your eyes ten minutes to adjust.`,
    scene: `A fallen log in darkness, veined with slowly breathing green filaments of light.`,
  },
  {
    key: 'glowworm-cave', title: 'Cave glowworm', latin: 'Arachnocampa spp.',
    kind: 'living light', color: '#5ff2df',
    description: `Not a worm but the larva of a fungus gnat, which spends most of its year-long life fishing. Each larva hangs dozens of silk lines beaded with sticky mucus from a cave ceiling or a damp gully bank, then glows blue-green from the tip of its abdomen, where modified excretory tubules host a firefly-like luciferase acting on a luciferin all its own. Midges fly toward the light and stick. The adult emerges without working mouthparts and lives a few days; every meal is caught by lamplight, as a larva.`,
    where: `See Arachnocampa luminosa at Waitomo or Te Anau in New Zealand, or its close cousin A. flava in Australia at Natural Bridge and Springbrook in the Gold Coast hinterland — any wet, overhung bank in a rainforest gully, well after full dark.`,
    scene: `A cave ceiling strung with steady blue-green points of light, each trailing a beaded silk line.`,
  },
  {
    key: 'st-elmos-fire', title: "St. Elmo's fire", latin: 'corona discharge',
    kind: 'electrical light', color: '#8c85ff',
    description: `Under a thundercloud, the atmosphere's electric field steepens at sharp conductive points: mastheads, wingtips, spires, even cattle horns. At sufficient strength it strips electrons from air molecules, sustaining a small plasma, a corona discharge. Excited nitrogen and oxygen relax by shedding blue-violet photons, the same physics as a gas-discharge lamp. Unlike lightning's flash, the glow can persist for minutes. Mediterranean sailors named it for Saint Erasmus, their patron, and took the fire on their rigging as his guardianship — often, in truth, a warning that lightning was near.`,
    where: `During a thunderstorm, watch pointed conductors overhead: ship masts, radio antennas, and, from an airliner window seat at night, the wingtips; pilots get the windscreen view.`,
    scene: `A ship's mast at night; violet brushes of light flicker continuously from the tip and yard-arm ends.`,
  },
  {
    key: 'sprite', title: 'Red sprites', latin: 'transient luminous event',
    kind: 'electrical light', color: '#ff5349',
    description: `Pilots reported them for decades and were rarely believed; a University of Minnesota camera, running by chance in 1989, finally caught one. Sprites bloom 50 to 90 kilometers above powerful thunderstorms, usually milliseconds after a strong positive lightning stroke below. Excited nitrogen molecules give the glow its red, thinning to bluish tendrils near the bottom. Shapes come in carrots, columns, and jellyfish, some tens of kilometers tall — over before the eye is sure it saw anything.`,
    where: `From a dark site on a clear night, face a large active thunderstorm 100 to 300 kilometers away and watch the sky well above its cloud tops; summer storm complexes over the American Great Plains are dependable producers.`,
    scene: `Darkness above a distant storm; every several seconds a red jellyfish of streamers blooms high in the sky and is gone within a heartbeat.`,
  },
  {
    key: 'airglow', title: 'Airglow', latin: 'nightglow · OI 557.7 nm',
    kind: 'atmospheric light', color: '#98e05c',
    description: `Even the darkest desert sky glows faintly on its own. Daylight ultraviolet splits oxygen molecules high in the atmosphere; all night the freed atoms recombine, and some collisions leave one atom holding energy it finally sheds as a photon at 557.7 nanometers — the green line of atomic oxygen. The emitting layer is a thin shell near 95 kilometers, some ten kilometers deep. At a dark site, airglow supplies more light than all the stars combined; no night sky on Earth is ever fully black.`,
    where: `From any site far from city lights when the moon is down, point a camera 10 to 20 degrees above the horizon and expose for 15 to 30 seconds; the faint green banding in the frame is airglow, sometimes visible to fully dark-adapted eyes as a pale sheen.`,
    scene: `A dark treeline under a night sky banded with faint green light, rippling almost too slowly to notice.`,
  },
  {
    key: 'zodiacal-light', title: 'Zodiacal light', latin: 'al-fajr al-kādhib · the false dawn',
    kind: 'celestial light', color: '#d9d2bd',
    description: `Sunlight does all the work here. A sparse cloud of dust, most of it shed by Jupiter-family comets, drifts in the plane of the planets and scatters light from the sun below the horizon back toward Earth: a pale, tilted pyramid leaning along the ecliptic. Each grain slowly spirals sunward, so comets keep the cloud restocked. Medieval Islamic astronomers called it the false dawn and ruled that it does not begin the fast. From dark ground it can rival the Milky Way.`,
    where: `From a dark site at mid-northern latitudes, look west an hour or two after sunset near the March equinox, or east before morning twilight near the September one.`,
    scene: `A tilted pyramid of pale grainy light leans up from the horizon corner among sparse stars.`,
  },
  {
    key: 'earthshine', title: 'Earthshine', latin: 'lumière cendrée · the ashen light',
    kind: 'celestial light', color: '#a9bccd',
    description: `Look at a young crescent and the rest of the disk is still there: a full circle of dim blue-gray closed inside the bright horns. Sunlight strikes Earth, glances off clouds and ocean, crosses to the Moon's night side, and bounces back to your eye — three legs of travel for one faint glow. Leonardo da Vinci worked out the mechanism around 1510 in the Codex Leicester, crediting the seas; clouds, we now know, do most of the reflecting. Its brightness tracks Earth's weather.`,
    where: `Find a thin crescent low in the west in the hour after sunset, within three or four days of new moon, and look for the faint circle completing it; binoculars help.`,
    scene: `A crescent moon whose dark remainder shows as a dim blue-gray disc, its glow slowly breathing.`,
  },
  {
    key: 'milky-sea', title: 'Milky seas', latin: 'cf. Vibrio harveyi',
    kind: 'living light', color: '#d4ecda',
    description: `On rare nights, mostly in the northwest Indian Ocean, whole stretches of sea turn a steady, even white — sailors have compared it to sailing across a snowfield. The light comes from luminous bacteria, likely Vibrio harveyi, which switch on together once their numbers pass a quorum threshold, perhaps feeding on a dying algal bloom. A 1995 report from the merchant ship Lima matched a glow in satellite imagery covering some 15,000 square kilometers; a 2019 event off Java exceeded 100,000 and lasted more than a month.`,
    where: `From a ship's deck late on a dark night in the northwest Indian Ocean or the seas around Indonesia, where nearly all credible reports cluster; no one can yet predict an event, so this one finds you.`,
    scene: `An evenly glowing pale sea under a black sky; a small dark ship creeps across for scale.`,
  },
  {
    key: 'will-o-the-wisp', title: "Will-o'-the-wisp", latin: 'ignis fatuus · the foolish fire',
    kind: 'contested light', color: '#a8d8ef',
    description: `Reported for centuries over bogs, fens, and churchyard ditches: a small pale-blue flame that flickered above the mud and, witnesses swore, retreated when followed. The standing hypothesis blames marsh gas, methane touched off by traces of diphosphane, a phosphorus compound igniting on contact with air. But laboratory cool flames come out faint and greenish, the wrong color, and the wild light has never been conclusively documented. Drain a wetland and its reports stop. Every other entry here has a mechanism; this one has only witnesses.`,
    where: `Almost nowhere now: your best remaining odds are an undrained peat bog on a warm, windless night far from artificial light, and even there no verified sighting has been made in decades.`,
    scene: `Marsh reeds in darkness; one pale flame gutters above the mud, goes out, and relights farther away.`,
  },
];

/* ============ vignette drawing ============ */

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

function rand(seed) {
  // small deterministic PRNG so each plate draws the same scene every visit
  let s = seed >>> 0;
  return function () {
    s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

function hexA(hex, a) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

function glowDot(ctx, x, y, r, hex, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, hexA(hex, a));
  g.addColorStop(0.4, hexA(hex, a * 0.35));
  g.addColorStop(1, hexA(hex, 0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function nightGround(ctx, w, h, starSeed, horizon) {
  ctx.fillStyle = '#070d16';
  ctx.fillRect(0, 0, w, h);
  const r = rand(starSeed);
  ctx.save();
  for (let i = 0; i < 70; i++) {
    const x = r() * w, y = r() * (horizon !== undefined ? horizon : h);
    ctx.globalAlpha = 0.05 + r() * 0.25;
    ctx.fillStyle = '#cfd8de';
    ctx.fillRect(x, y, 1, 1);
  }
  ctx.restore();
}

/* Each drawer: (ctx, w, h, t seconds, still) — static scenery is deterministic
   per plate; transient light is allowed to be alive. */

const VSTATE = {};

function zodSample(r, w, h) {
  const len = h * 0.75;
  let d = -Math.log(1 - r()) * (len / 2.6);
  if (d > len) d = r() * len;
  const f = d / len;
  const g = (r() + r() + r() - 1.5) / 1.5;
  const sigma = (1 - f) * w * 0.14 + 5;
  const bx = w * 0.36, by = h * 0.82;
  return [bx + 0.40 * d + 0.917 * g * sigma, by - 0.917 * d + 0.40 * g * sigma];
}

const DRAWERS = {

  'sea-sparkle': function (ctx, w, h, t, still) {
    const c = this.color;
    const horizon = h * 0.42;
    nightGround(ctx, w, h, 11, horizon);
    ctx.fillStyle = '#0a1420';
    ctx.fillRect(0, horizon, w, h - horizon);
    const st = VSTATE.sea || (VSTATE.sea = { sparks: [], lastStray: 0 });
    const SWEEP = 5.2;
    const tw = still ? 0 : t;
    const phase = still ? 0.5 : (t % SWEEP) / SWEEP;
    // wave edge sweeping toward the viewer
    const edgeY = horizon + (h - horizon) * (0.15 + phase * 0.65);
    const waveY = (x) => edgeY + Math.sin(x * 0.018 + tw * 0.7) * 4;
    ctx.strokeStyle = 'rgba(140,160,175,0.10)';
    ctx.beginPath();
    for (let x = 0; x <= w; x += 6) { const y = waveY(x); x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke();
    if (still) {
      const r = rand(23);
      for (let i = 0; i < 30; i++) { const x = r() * w; glowDot(ctx, x, waveY(x) + (r() - 0.5) * 8, 5, c, 0.5); }
      return;
    }
    // instant attack, tenth-of-a-second life, light only where the edge just was
    if (phase > 0.18 && phase < 0.78 && st.sparks.length < 70) {
      for (let i = 0; i < 4; i++) {
        const x = Math.random() * w;
        st.sparks.push({ x, y: waveY(x) + (Math.random() - 0.5) * 8, t0: t });
      }
    }
    if (t - st.lastStray > 0.55) {
      st.lastStray = t;
      st.sparks.push({ x: Math.random() * w, y: edgeY + (Math.random() - 0.5) * 26, t0: t });
    }
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = st.sparks.length - 1; i >= 0; i--) {
      const s = st.sparks[i];
      const age = t - s.t0;
      if (age > 0.16 || age < 0) { st.sparks.splice(i, 1); continue; }
      const a = 1 - age / 0.16;
      glowDot(ctx, s.x, s.y, 5.5, c, 0.8 * a);
      ctx.fillStyle = 'rgba(240,250,255,' + (0.9 * a).toFixed(3) + ')';
      ctx.fillRect(s.x - 0.75, s.y - 0.75, 1.5, 1.5);
    }
    ctx.restore();
  },

  'foxfire': function (ctx, w, h, t, still) {
    const c = this.color;
    nightGround(ctx, w, h, 31);
    // fallen log, edge readable only where glow spills onto it
    ctx.fillStyle = '#0c141f';
    ctx.beginPath();
    ctx.ellipse(w * 0.5, h * 0.68, w * 0.4, h * 0.085, -0.05, 0, Math.PI * 2);
    ctx.fill();
    let st = VSTATE.fox;
    if (!st || st.w !== w) {
      st = VSTATE.fox = { w, fil: [] };
      const r = rand(7);
      for (let i = 0; i < 8; i++) {
        const pts = [];
        let x = w * (0.16 + r() * 0.68), y = h * 0.68 + (r() - 0.5) * h * 0.06;
        pts.push([x, y]);
        const segs = 4 + Math.floor(r() * 4);
        for (let s = 0; s < segs; s++) {
          x += (r() - 0.5) * w * 0.07;
          y += (r() - 0.6) * h * 0.035;
          pts.push([x, y]);
        }
        st.fil.push({ pts, ph: r() * Math.PI * 2, f: (2 * Math.PI) / (8 + r() * 4) });
      }
    }
    // branching mycelium filaments; the light breathes but never blinks off
    ctx.save();
    ctx.shadowColor = hexA(c, 0.8);
    ctx.shadowBlur = 10;
    for (const f of st.fil) {
      const a = still ? 0.3 : 0.2 + 0.16 * (0.5 + 0.5 * Math.sin(t * f.f + f.ph));
      ctx.strokeStyle = hexA(c, a);
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      f.pts.forEach((p, i) => (i === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1])));
      ctx.stroke();
      const end = f.pts[f.pts.length - 1];
      glowDot(ctx, end[0], end[1], 8, c, a * 0.9);
    }
    ctx.restore();
  },

  'glowworm-cave': function (ctx, w, h, t, still) {
    ctx.fillStyle = '#05090f';
    ctx.fillRect(0, 0, w, h);
    const c = this.color;
    const r = rand(47);
    // cave ceiling arch of steady lights with hanging silk lines
    for (let i = 0; i < 60; i++) {
      const x = r() * w;
      const arch = h * 0.16 + Math.pow(Math.abs(x - w / 2) / (w / 2), 2) * h * 0.22;
      const y = arch + r() * h * 0.05;
      const len = 6 + r() * h * 0.16;
      const sway = still ? 0 : Math.sin(t * 0.4 + i) * 1.2;
      ctx.strokeStyle = 'rgba(140,160,175,0.08)';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + sway, y + len * 0.6, x + sway, y + len);
      ctx.stroke();
      // beads of mucus catching the glow
      ctx.fillStyle = hexA(c, 0.25);
      for (let g = 1; g <= 2; g++) {
        ctx.fillRect(x + sway * (g / 3) - 0.5, y + (len * g) / 3, 1, 1);
      }
      const steady = still ? 0.8 : 0.7 + 0.3 * Math.sin(t * (0.15 + r() * 0.2) + i * 3);
      glowDot(ctx, x + sway, y + len, 3.5 + r() * 3, c, 0.65 * steady);
    }
  },

  'st-elmos-fire': function (ctx, w, h, t, still) {
    nightGround(ctx, w, h, 53, h * 0.9);
    const c = this.color;
    // mast
    ctx.strokeStyle = '#16222f';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(w * 0.5, h * 0.92);
    ctx.lineTo(w * 0.5, h * 0.22);
    ctx.stroke();
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(w * 0.34, h * 0.42);
    ctx.lineTo(w * 0.66, h * 0.42);
    ctx.stroke();
    // corona at the tips: fast jitter under a slow six-second swell,
    // continuous and attached to the points, never drifting sparks
    const swell = still ? 0.8 : 0.65 + 0.35 * Math.sin(t * (Math.PI / 3));
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const tips = [[0.5, 0.22], [0.34, 0.42], [0.66, 0.42]];
    const r = rand(Math.floor(still ? 1 : t * 14) + 5);
    for (const [fx, fy] of tips) {
      const x = w * fx, y = h * fy;
      glowDot(ctx, x, y, 16, c, (still ? 0.5 : 0.3 + r() * 0.4) * swell);
      // brush strokes
      ctx.strokeStyle = hexA(c, 0.5 * swell);
      ctx.lineWidth = 1;
      const strokes = 5;
      for (let i = 0; i < strokes; i++) {
        const a = -Math.PI / 2 + (r() - 0.5) * 1.6 + (fy === 0.42 ? (fx < 0.5 ? -0.7 : 0.7) : 0);
        const len = 8 + r() * 20;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
        ctx.stroke();
      }
    }
    ctx.restore();
  },

  'airglow': function (ctx, w, h, t, still) {
    nightGround(ctx, w, h, 61, h * 0.72);
    const c = this.color;
    // banded airglow, brightest low, rippling like gravity waves —
    // sky-wide and almost too slow to see moving, never a localized curtain
    for (let i = 0; i < 5; i++) {
      const y = h * (0.42 + i * 0.075);
      const base = 0.035 + i * 0.014;
      const a = still ? base : base * (0.6 + 0.4 * Math.sin(t * ((2 * Math.PI) / (24 + i * 6)) + i * 2.1));
      const drift = still ? 0 : Math.sin(t * ((2 * Math.PI) / (30 + i * 8)) + i * 1.3) * w * 0.04;
      const grad = ctx.createLinearGradient(0, y - 18, 0, y + 18);
      grad.addColorStop(0, hexA(c, 0));
      grad.addColorStop(0.5, hexA(c, a));
      grad.addColorStop(1, hexA(c, 0));
      ctx.fillStyle = grad;
      ctx.save();
      ctx.translate(drift, 0);
      ctx.fillRect(-w * 0.06, y - 18, w * 1.12, 36);
      ctx.restore();
    }
    // dark treeline
    ctx.fillStyle = '#060b12';
    const r = rand(19);
    ctx.beginPath();
    ctx.moveTo(0, h);
    for (let x = 0; x <= w; x += 14) ctx.lineTo(x, h * 0.78 - r() * h * 0.05);
    ctx.lineTo(w, h);
    ctx.closePath();
    ctx.fill();
  },

  'zodiacal-light': function (ctx, w, h, t, still) {
    const c = this.color;
    nightGround(ctx, w, h, 71, h * 0.8);
    // a wedge of dust-grains: broad and brightest at the horizon corner,
    // tapering along one tilted axis; the grain churns, the wedge never moves
    let st = VSTATE.zod;
    if (!st || st.w !== w || st.h !== h) {
      st = VSTATE.zod = { w, h, pts: [] };
      const r = rand(71);
      for (let i = 0; i < 2200; i++) st.pts.push(zodSample(r, w, h));
    }
    if (!still) {
      const r = rand(Math.floor(t * 30) + 977);
      for (let i = 0; i < 20; i++) st.pts[Math.floor(r() * st.pts.length)] = zodSample(r, w, h);
    }
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = hexA(c, 0.05);
    for (const p of st.pts) ctx.fillRect(p[0], p[1], 1, 1);
    ctx.restore();
    ctx.fillStyle = '#060b12';
    ctx.fillRect(0, h * 0.82, w, h * 0.18);
  },

  'sprite': function (ctx, w, h, t, still) {
    nightGround(ctx, w, h, 83, h * 0.86);
    const c = this.color;
    // distant storm cell
    ctx.fillStyle = '#0d1520';
    ctx.beginPath();
    ctx.ellipse(w * 0.5, h * 0.9, w * 0.28, h * 0.07, 0, 0, Math.PI * 2);
    ctx.fill();
    // the wait is the point: long dark gaps, then the parent stroke below,
    // then the sprite above it a beat later, gone within a third of a second
    const cycle = 7;
    // first strike lands about a second after the plate opens; after that,
    // the true long waits
    const te = t - plateShownAt + (cycle - 1.2);
    const ph = still ? 0.03 : (te % cycle) / cycle;
    const flash = ph < 0.03 ? 1 - ph / 0.03 : 0;
    const sp = still ? 0.7 : (ph > 0.015 && ph < 0.055 ? 1 - (ph - 0.015) / 0.04 : 0);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    if (flash > 0) {
      ctx.fillStyle = 'rgba(233,228,214,' + (0.12 * flash).toFixed(3) + ')';
      ctx.beginPath();
      ctx.ellipse(w * 0.5, h * 0.89, w * 0.2, h * 0.045, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    if (sp > 0) {
      const r = rand(still ? 29 : Math.floor(te / cycle) + 29);
      const cx = w * (0.4 + r() * 0.2);
      const tendrils = 9;
      for (let i = 0; i < tendrils; i++) {
        const a = Math.PI / 2 + (i / (tendrils - 1) - 0.5) * 0.9;
        const topY = h * (0.16 + r() * 0.06);
        const len = h * (0.2 + r() * 0.16);
        const ex = cx + Math.cos(a) * (8 + len * 0.4);
        const ey = topY + len;
        // red body of the tendril
        ctx.strokeStyle = hexA(c, 0.75 * sp);
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * 8, topY);
        ctx.lineTo(cx + Math.cos(a) * (8 + len * 0.28), topY + len * 0.7);
        ctx.stroke();
        // bluish lowest reach
        ctx.strokeStyle = 'rgba(122,160,255,' + (0.4 * sp).toFixed(3) + ')';
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * (8 + len * 0.28), topY + len * 0.7);
        ctx.lineTo(ex, ey);
        ctx.stroke();
      }
      glowDot(ctx, cx, h * 0.2, 34, c, 0.5 * sp);
    }
    ctx.restore();
  },

  'milky-sea': function (ctx, w, h, t, still) {
    nightGround(ctx, w, h, 97, h * 0.4);
    const c = this.color;
    // the whole sea glows, horizon to hull
    const grad = ctx.createLinearGradient(0, h * 0.42, 0, h);
    grad.addColorStop(0, hexA(c, 0.16));
    grad.addColorStop(1, hexA(c, 0.05));
    ctx.fillStyle = grad;
    ctx.fillRect(0, h * 0.42, w, h * 0.58);
    // soft blotches drifting sideways: lit snow, no sparkles, no waves
    const r = rand(97);
    const swell = still ? 1 : 1 + 0.12 * Math.sin(t * (Math.PI / 10));
    for (let i = 0; i < 14; i++) {
      const bx = ((r() + (still ? 0 : t * 0.004 * (0.5 + r()))) % 1) * w;
      const by = h * (0.46 + r() * 0.5);
      glowDot(ctx, bx, by, 30 + r() * 50, c, 0.05 * swell);
    }
    // dark ship silhouette creeping across — the scale cue
    const shipX = still ? w * 0.62 : (((t / 70) % 1.3) - 0.15) * w;
    ctx.fillStyle = '#050a11';
    ctx.fillRect(shipX, h * 0.475, w * 0.13, h * 0.035);
    ctx.fillRect(shipX + w * 0.045, h * 0.415, w * 0.012, h * 0.06);
  },

  'earthshine': function (ctx, w, h, t, still) {
    nightGround(ctx, w, h, 101);
    const c = this.color;
    const cx = w * 0.5, cy = h * 0.46, R = Math.min(w, h) * 0.24;
    // Earth's shifting cloud cover, breathing the glow over ~9 seconds
    const breathe = still ? 1 : 1 + 0.3 * Math.sin(t * ((2 * Math.PI) / 9));
    // halo
    glowDot(ctx, cx, cy, R * 2.1, c, 0.09 * breathe);
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.clip();
    // bright disc first...
    ctx.fillStyle = '#efe9d8';
    ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
    // ...then carve back to the dim earthlit disc, offset so a thin
    // crescent survives along the lower-right limb: the bright horns
    // cradling the dim full circle
    ctx.beginPath();
    ctx.arc(cx - R * 0.16, cy - R * 0.13, R * 0.97, 0, Math.PI * 2);
    ctx.fillStyle = '#070d16';
    ctx.fill();
    ctx.fillStyle = hexA(c, 0.17 * breathe);
    ctx.fill();
    // faint maria on the earthlit part
    const r = rand(101);
    ctx.fillStyle = hexA(c, 0.09);
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.arc(cx + r() * R * 0.9 - R * 0.2, cy + (r() - 0.5) * R * 1.1, R * (0.09 + r() * 0.12), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  },

  'will-o-the-wisp': function (ctx, w, h, t, still) {
    nightGround(ctx, w, h, 113, h * 0.7);
    const c = this.color;
    // marsh reeds
    const r = rand(37);
    ctx.strokeStyle = '#0e1722';
    for (let i = 0; i < 40; i++) {
      const x = r() * w;
      const base = h * (0.8 + r() * 0.18);
      const lean = (r() - 0.5) * 10 + (still ? 0 : Math.sin(t * 0.5 + i) * 2);
      ctx.lineWidth = 1 + r();
      ctx.beginPath();
      ctx.moveTo(x, base);
      ctx.quadraticCurveTo(x + lean * 0.4, base - h * 0.1, x + lean, base - h * (0.12 + r() * 0.12));
      ctx.stroke();
    }
    // the signature is relocation: it goes out here and relights over there,
    // seeming to recede rather than travel. one flame only.
    let st = VSTATE.wisp;
    if (!st) st = VSTATE.wisp = { x: 0.62, until: 8, lit: 0, jumps: 0 };
    let alpha;
    if (still) { alpha = 0.8; }
    else {
      if (t > st.until) {
        st.jumps++;
        const r = rand(st.jumps * 131 + 17);
        const dir = st.x > 0.5 ? -1 : 1;
        st.x = Math.min(0.85, Math.max(0.15, st.x + dir * (0.2 + r() * 0.2)));
        st.until = t + 7 + r() * 3;
        st.lit = t + 1;
      }
      const fadeOut = Math.min(1, Math.max(0, st.until - t));
      const fadeIn = Math.min(1, Math.max(0, 1 - (st.lit - t)));
      alpha = Math.min(fadeOut, fadeIn);
    }
    const gut = still ? 1 : 0.85 + 0.15 * Math.sin(t * 9) * Math.sin(t * 3.7);
    const wx = st.x * w;
    const wy = h * 0.6 + (still ? 0 : Math.sin(t * 0.9) * h * 0.02);
    glowDot(ctx, wx, wy, 24, c, 0.35 * alpha * gut);
    glowDot(ctx, wx, wy, 7, c, 0.75 * alpha * gut);
    // faint answer in the marsh water
    glowDot(ctx, wx, h * 0.93, 15, c, 0.07 * alpha);
  },
};

/* ============ book mechanics ============ */

const canvas = document.getElementById('vignette');
const ctx = canvas.getContext('2d');
const indexList = document.getElementById('indexList');
const plateNo = document.getElementById('plateNo');
const entryTitle = document.getElementById('entryTitle');
const entryLatin = document.getElementById('entryLatin');
const entryKind = document.getElementById('entryKind');
const entryDesc = document.getElementById('entryDesc');
const entryWhere = document.getElementById('entryWhere');
const countLine = document.getElementById('countLine');
const plateStatus = document.getElementById('plateStatus');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];
let current = 0;
let W = 0, H = 0;
let plateShownAt = 0;

function sizeCanvas() {
  if (!ctx) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth || canvas.parentElement.clientWidth;
  H = Math.round(W * 0.56);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function buildIndex() {
  indexList.textContent = '';
  ENTRIES.forEach((e, i) => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = ROMAN[i];
    btn.appendChild(num);
    btn.appendChild(document.createTextNode(e.title));
    btn.addEventListener('click', () => show(i));
    li.appendChild(btn);
    indexList.appendChild(li);
  });
}

function show(i) {
  current = (i + ENTRIES.length) % ENTRIES.length;
  plateShownAt = clock;
  const e = ENTRIES[current];
  document.documentElement.style.setProperty('--accent', e.color);
  entryTitle.textContent = e.title;
  entryLatin.textContent = e.latin;
  entryLatin.hidden = !e.latin;
  entryKind.textContent = e.kind;
  entryDesc.textContent = e.description;
  entryWhere.innerHTML = '';
  const k = document.createElement('span');
  k.className = 'k';
  k.textContent = 'where to look · ';
  entryWhere.appendChild(k);
  entryWhere.appendChild(document.createTextNode(e.where));
  canvas.setAttribute('aria-label', e.scene || e.title);
  plateNo.textContent = 'PLATE ' + ROMAN[current];
  countLine.textContent = (current + 1) + ' / ' + ENTRIES.length;
  plateStatus.textContent = 'Plate ' + ROMAN[current] + ': ' + e.title;
  [...indexList.querySelectorAll('button')].forEach((b, j) =>
    b.setAttribute('aria-current', String(j === current)));
}

prevBtn.addEventListener('click', () => show(current - 1));
nextBtn.addEventListener('click', () => show(current + 1));

document.addEventListener('keydown', (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.target && /^(input|textarea|select)$/i.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); show(current + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); show(current - 1); }
});

window.addEventListener('resize', sizeCanvas);

let last = performance.now(), clock = 0;
function frame(nowMs) {
  const dt = Math.min((nowMs - last) / 1000, 0.1);
  last = nowMs;
  clock += dt;
  const e = ENTRIES[current];
  if (e && ctx) {
    const drawer = DRAWERS[e.key];
    if (drawer) drawer.call({ color: e.color }, ctx, W, H, clock, reduceMotion.matches);
  }
  requestAnimationFrame(frame);
}

if (ENTRIES.length) {
  buildIndex();
  show(0);
}
if (ctx && ENTRIES.length) {
  sizeCanvas();
  requestAnimationFrame(frame);
}
</script>
